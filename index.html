<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d0d1a" />
  <meta name="description"
    content="Barcode & Serial Number Scanner – scan barcodes and QR codes using your device camera." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>BarScan – Barcode Serial Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- ── Animated Background ──────────────────────────────── -->
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- ── App Shell ─────────────────────────────────────────── -->
  <div class="app-shell">

    <!-- Header -->
    <header class="app-header">
      <div class="header-logo">
        <span class="logo-icon">📷</span>
        <span class="logo-text">BarScan</span>
      </div>
      <div class="header-actions">
        <button id="btn-settings" class="icon-btn" title="ตั้งค่า" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <button id="btn-export" class="icon-btn" title="Export CSV" aria-label="Export CSV">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
        </button>
        <button id="btn-clear-all" class="icon-btn danger" title="Clear all" aria-label="Clear all records">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
            <path d="M10 11v6M14 11v6" />
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
          </svg>
        </button>
      </div>
    </header>

    <!-- ── Scanner Section ──────────────────────────────────── -->
    <section class="scanner-section" id="scanner-section">

      <div class="scanner-card">
        <!-- Camera viewport -->
        <div class="viewport-wrapper" id="viewport-wrapper">
          <video id="camera-feed" autoplay playsinline muted></video>
          <canvas id="scan-canvas" aria-hidden="true"></canvas>

          <!-- Scan overlay -->
          <div class="scan-overlay" id="scan-overlay">
            <div class="scan-frame">
              <span class="corner tl"></span>
              <span class="corner tr"></span>
              <span class="corner bl"></span>
              <span class="corner br"></span>
            </div>
            <p class="scan-hint" id="scan-hint">Align barcode &amp; tap Capture</p>
          </div>

          <!-- Idle / Error state -->
          <div class="camera-idle" id="camera-idle">
            <div class="idle-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
                <circle cx="12" cy="13" r="4" />
              </svg>
            </div>
            <p class="idle-title" id="idle-title">Camera Ready</p>
            <p class="idle-sub" id="idle-sub">Tap the button below to start scanning</p>
          </div>

          <!-- Flash badge -->
          <div class="flash-badge" id="flash-badge" aria-live="polite"></div>
        </div>

        <!-- Controls -->
        <div class="scanner-controls">
          <button id="btn-toggle-camera" class="btn-primary" aria-label="Start camera">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
              <circle cx="12" cy="13" r="4" />
            </svg>
            <span id="btn-camera-label">Start Camera</span>
          </button>

          <button id="btn-capture" class="btn-capture" aria-label="Capture and scan barcode">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10" />
              <circle cx="12" cy="12" r="6" fill="currentColor" />
            </svg>
            <span>Capture</span>
          </button>

          <div class="aux-controls">
            <button id="btn-flip-camera" class="aux-btn" title="Flip camera" aria-label="Flip camera" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M1 4v6h6" />
                <path d="M23 20v-6h-6" />
                <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 0 1 3.51 15" />
              </svg>
            </button>
            <button id="btn-torch" class="aux-btn" title="Toggle flashlight" aria-label="Toggle flashlight" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
              </svg>
            </button>
            <button id="btn-manual" class="aux-btn" title="Enter manually" aria-label="Enter manually">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <line x1="17" y1="10" x2="3" y2="10" />
                <line x1="21" y1="6" x2="3" y2="6" />
                <line x1="21" y1="14" x2="3" y2="14" />
                <line x1="17" y1="18" x2="3" y2="18" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Sticky Model Bar -->
      <div class="sticky-model-bar">
        <label for="input-sticky-model" class="sticky-label">ปักหมุดชื่อรุ่น (Sticky Model) 📌</label>
        <div class="sticky-input-group">
          <input type="text" id="input-sticky-model" class="sticky-input" placeholder="สแกนชื่อรุ่น แล้วกดล็อค ➔" autocomplete="off">
          <button id="btn-lock-model" class="sticky-btn" title="ล็อคชื่อรุ่น" aria-label="Lock Model">
            <svg class="icon-unlock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Stats bar -->
      <div class="stats-bar">
        <div class="stat-item">
          <span class="stat-value" id="stat-total">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-value" id="stat-session">0</span>
          <span class="stat-label">This Session</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-value" id="stat-unique">0</span>
          <span class="stat-label">Unique</span>
        </div>
      </div>
    </section>

    <!-- ── Records Section ───────────────────────────────────── -->
    <section class="records-section">
      <div class="records-header">
        <h2 class="records-title">Scanned Records</h2>
        <div class="search-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            aria-hidden="true">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input id="input-search" class="search-input" type="search" placeholder="Search serial…"
            aria-label="Search records" />
        </div>
      </div>

      <ul class="records-list" id="records-list" role="list" aria-label="Scanned records">
        <!-- Records injected by JS -->
      </ul>

      <div class="empty-state" id="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M16 2v4M8 2v4M3 10h18" />
            <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01" />
          </svg>
        </div>
        <p class="empty-title">No records yet</p>
        <p class="empty-sub">Start scanning to collect serial numbers</p>
      </div>
    </section>
  </div>

  <!-- ── Manual Entry Modal ────────────────────────────────── -->
  <!-- ── Manual Entry Modal ────────────────────────────────── -->
  <div class="modal-backdrop" id="manual-modal" aria-modal="true" role="dialog" aria-label="Manual entry">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">เพิ่มรายการ</h3>
        <button class="modal-close" id="btn-close-modal" aria-label="Close modal">✕</button>
      </div>
      <div class="modal-body">
        <label class="field-label" for="input-manual-model">ชื่อรุ่น <span class="field-optional">(ไม่บังคับ)</span></label>
        <input id="input-manual-model" class="field-input" type="text" placeholder="เช่น HP LaserJet Pro M404" autocomplete="off" />
        <label class="field-label" for="input-manual" style="margin-top:14px">Serial / Barcode Number</label>
        <input id="input-manual" class="field-input" type="text" placeholder="e.g. SN-2024-001234" autocomplete="off" />
        <p class="field-error" id="manual-error" role="alert" aria-live="polite"></p>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" id="btn-cancel-modal">ยกเลิก</button>
        <button class="btn-primary small" id="btn-submit-manual">เพิ่มรายการ</button>
      </div>
    </div>
  </div>

  <!-- ── Edit Record Modal ─────────────────────────────────── -->
  <div class="modal-backdrop" id="edit-modal" aria-modal="true" role="dialog" aria-label="Edit record">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">แก้ไขรายการ</h3>
        <button class="modal-close" id="btn-close-edit" aria-label="Close modal">✕</button>
      </div>
      <div class="modal-body">
        <label class="field-label" for="input-edit-model">ชื่อรุ่น <span class="field-optional">(ไม่บังคับ)</span></label>
        <input id="input-edit-model" class="field-input" type="text" placeholder="เช่น HP LaserJet Pro M404" autocomplete="off" />
        <label class="field-label" for="input-edit-serial" style="margin-top:14px">Serial / Barcode Number</label>
        <input id="input-edit-serial" class="field-input" type="text" placeholder="e.g. SN-2024-001234" autocomplete="off" />
        <p class="field-error" id="edit-error" role="alert" aria-live="polite"></p>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" id="btn-cancel-edit">ยกเลิก</button>
        <button class="btn-primary small" id="btn-submit-edit">บันทึก</button>
      </div>
    </div>
  </div>

  <!-- ── Settings Modal ────────────────────────────────────── -->
  <div class="modal-backdrop" id="settings-modal" aria-modal="true" role="dialog" aria-label="Settings">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">ตั้งค่าการสแกน (Settings)</h3>
        <button class="modal-close" id="btn-close-settings" aria-label="Close settings">✕</button>
      </div>
      <div class="modal-body">
        <label class="field-label" for="input-delay-double">ระยะเวลาป้องกันการสแกนซ้ำ (Double Scan Delay) <br><span class="field-optional">หน่วยเป็นมิลลิวินาที (ms) ค่าแนะนำ: 2000</span></label>
        <input id="input-delay-double" class="field-input" type="number" min="0" step="100" placeholder="2000" autocomplete="off" />
        
        <label class="field-label" for="input-delay-group" style="margin-top:14px">เวลาหน่วงรับค่าจากเครื่องสแกน (Keystroke Delay) <br><span class="field-optional">หน่วยเป็นมิลลิวินาที (ms) ค่าแนะนำ: 500</span></label>
        <input id="input-delay-group" class="field-input" type="number" min="0" step="50" placeholder="500" autocomplete="off" />
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" id="btn-cancel-settings">ยกเลิก</button>
        <button class="btn-primary small" id="btn-save-settings">บันทึกตั้งค่า</button>
      </div>
    </div>
  </div>

  <!-- ── Toast ─────────────────────────────────────────────── -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- ── Scripts ───────────────────────────────────────────── -->
  <!-- ZXing for broad barcode support -->
  <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
